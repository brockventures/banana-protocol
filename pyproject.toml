[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-protocol"
version = "0.5.1"
description = "Canonical turn-claim client and v0/v1 handoff coordination protocol for Crab Cavern multi-agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Crab Cavern Engineers", email = "ryan@brockventures.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
# AsyncBananaClient imports aiohttp lazily, inside its methods, so the
# sync client works without it. The six async tests do not: they patch
# aiohttp.ClientSession, which requires the module to be importable.
async = [
    "aiohttp>=3.9"
]
dev = [
    "pytest>=7.0",
    "aiohttp>=3.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["banana*"]
